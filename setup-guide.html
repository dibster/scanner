<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>TrackVision Tablet Setup Guide</title>
<style>
  :root { --blue:#1857ff; --ink:#101828; --gray:#667085; --line:#e4e7ec; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; background:#f7f8fa;
    color:var(--ink); font-family:Inter,system-ui,sans-serif; }
  form { width:min(420px,100%); background:white; border:1px solid var(--line); border-radius:28px;
    box-shadow:0 12px 40px #10182812; padding:30px; }
  h1 { font-size:30px; line-height:1.1; margin:0 0 10px; }
  p { margin:0; color:var(--gray); font-size:17px; }
  label { display:block; color:var(--gray); font-weight:750; margin:18px 0 8px; }
  input { width:100%; border:1px solid var(--line); border-radius:14px; padding:14px 16px; font-size:20px; }
  button { width:100%; margin-top:18px; border:0; border-radius:14px; background:var(--blue); color:white;
    font-size:18px; font-weight:800; padding:14px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .error { min-height:22px; margin:12px 0 0; color:#b42318; font-weight:750; text-align:center; }
</style>
</head>
<body>
<form id="gate" hidden autocomplete="off">
  <h1>TrackVision setup guide</h1>
  <p>Enter your factory ID to open your guide.</p>
  <label for="factory-id">Factory ID</label>
  <input id="factory-id" inputmode="text" autocapitalize="off" spellcheck="false" autofocus>
  <button id="open" type="submit">Open guide</button>
  <p id="error" class="error" role="alert"></p>
</form>
<script>
(() => {
  // Each factory's guide is encrypted at f/<lookup>.bin, lookup = first 16 hex of
  // SHA-256("tv-guide:" + id); the key is PBKDF2-SHA256(id, salt, 250000) → AES-256-GCM.
  // Built by docs/tools/guide in tv-commissioning-app; keep both sides in step.
  const STORE = "tv-guide-factory-id";
  const form = document.getElementById("gate");
  const field = document.getElementById("factory-id");
  const button = document.getElementById("open");
  const error = document.getElementById("error");
  const enc = new TextEncoder();
  const b64d = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

  class Unknown extends Error {}

  async function lookup(id) {
    const digest = new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode("tv-guide:" + id)));
    return Array.from(digest.slice(0, 8), (b) => b.toString(16).padStart(2, "0")).join("");
  }

  async function open(raw) {
    const id = raw.trim();
    if (!id) throw new Unknown();
    const response = await fetch("f/" + (await lookup(id)) + ".bin", { cache: "no-cache" });
    if (response.status === 404) throw new Unknown();
    if (!response.ok) throw new Error("HTTP " + response.status);
    const box = await response.json();
    const material = await crypto.subtle.importKey("raw", enc.encode(id), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64d(box.salt), iterations: 250000, hash: "SHA-256" },
      material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    let plain;
    try {
      plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(box.iv) }, key, b64d(box.ct));
    } catch {
      throw new Unknown();
    }
    try { sessionStorage.setItem(STORE, id); } catch {}
    document.open();
    document.write(new TextDecoder().decode(plain));
    document.close();
  }

  function showForm(message) {
    form.hidden = false;
    error.textContent = message || "";
    button.disabled = false;
    button.textContent = "Open guide";
    field.focus();
    field.select();
  }

  function failed(err) {
    try { sessionStorage.removeItem(STORE); } catch {}
    showForm(err instanceof Unknown ? "Unknown factory ID." : "Could not load the guide. Check the connection and try again.");
  }

  if (!globalThis.crypto?.subtle) {
    form.hidden = false;
    error.textContent = "This browser cannot open the guide. Open the link over https.";
    button.disabled = true;
    return;
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    error.textContent = "";
    button.disabled = true;
    button.textContent = "Opening…";
    open(field.value).catch(failed);
  });

  let saved;
  try { saved = sessionStorage.getItem(STORE); } catch {}
  if (saved) {
    field.value = saved;
    open(saved).catch(failed);
  } else {
    showForm();
  }
})();
</script>
</body>
</html>
